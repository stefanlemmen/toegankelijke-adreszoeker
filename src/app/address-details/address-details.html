<!-- Always rendered: screen readers can miss a live region added together with its text. -->
<p role="status">
  @if (failed()) {
    {{ lookupError }}
  }
</p>
@if (address(); as address) {
  <dl>
    <dt>Straat</dt>
    <dd>{{ address.straatnaam }}</dd>
    <dt>Huisnummer</dt>
    <dd>{{ address.huis_nlt }}</dd>
    <dt>Postcode</dt>
    <dd>{{ address.postcode ?? unknown }}</dd>
    <dt>Woonplaats</dt>
    <dd>{{ address.woonplaatsnaam }}</dd>
    <dt>Gemeente</dt>
    <dd>{{ address.gemeentenaam }}</dd>
  </dl>
}
