@let chosen = address();
<div
  role="img"
  [style.--columns]="columns"
  [style.--tile-size.px]="tileSize"
  [style.translate]="map().translate"
  [attr.aria-label]="
    chosen ? 'Kaart met de ligging van ' + chosen.weergavenaam : 'Kaart van Nederland'
  "
>
  @for (tile of map().tiles; track tile.light) {
    <picture>
      <source media="(prefers-color-scheme: dark)" [srcset]="tile.dark" />
      <!-- Chrome draws a broken-image icon for a failed tile, even with an empty alt. -->
      <img
        #img
        [src]="tile.light"
        alt=""
        [width]="tileSize"
        [height]="tileSize"
        (error)="img.hidden = true"
      />
    </picture>
  }
</div>
@if (chosen) {
  <!-- The map's label already names the address; dark with a white edge stands out on light and grey tiles (WCAG 1.4.11). -->
  <svg class="marker" aria-hidden="true" viewBox="-2 -2 28 38" width="28" height="38">
    <path
      d="M12 0C5.4 0 0 5.4 0 12c0 9 12 24 12 24s12-15 12-24C24 5.4 18.6 0 12 0z"
      fill="#1a1a1a"
      stroke="#ffffff"
      stroke-width="2"
    />
    <circle cx="12" cy="12" r="4.5" fill="#ffffff" />
  </svg>
}
