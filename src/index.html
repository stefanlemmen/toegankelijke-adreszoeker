<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Adreszoeker – zoek een adres in Nederland</title>
    <meta
      name="description"
      content="Zoek een Nederlands adres en bekijk de details, via de publieke PDOK Locatieserver."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Fetch the body font alongside the stylesheet instead of after it. Media files keep their name (outputHashing "bundles" in angular.json), so this path stays valid; crossorigin because fonts are always fetched in CORS mode. -->
    <link
      rel="preload"
      href="media/open-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
